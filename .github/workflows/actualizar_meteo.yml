name: Actualizar Datos Meteo

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repositorio
      uses: actions/checkout@v4

    - name: Descargar JSON de la API
      run: |
        curl -s "https://climameteoinfo.com{{ secrets.METEO_API_KEY }}&format=json" -o datos.json

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías de gráficos
      run: pip install matplotlib

    - name: Generar Gráfico Estático
      run: python generar_grafico.py

    - name: Confirmar y subir cambios
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        # Guardamos el JSON de la API, el archivo de historial acumulativo y el nuevo gráfico lineal
        git add datos.json historico_dia.json grafico_dia.png
        git diff --quiet && git diff --staged --quiet || (git commit -m "Meteo: Historial y gráfico del día actualizados" && git push)
