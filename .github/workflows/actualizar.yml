name: Guardar Datos de la Estación

on:
  schedule:
    - cron: '*/15 * * * *' # Se ejecuta automáticamente cada 15 minutos
  workflow_dispatch: # Activa el botón para hacer pruebas manuales

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite al robot guardar el archivo JSON resultante
    steps:
    - name: 1. Descargar repositorio en el servidor
      uses: actions/checkout@v4

    - name: 2. Descargar el JSON directo de WeatherLink
      run: |
        curl -s "https://api.weatherlink.com/v1/NoaaExt.json?user=001D0AE0D724&pass=semiuncial4&apiToken=BB6FD1E154A74270A0A613E9C2CFAAEE" -o estacion.json

    - name: 3. Guardar el JSON actualizado en tu repositorio
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        git pull origin HEAD
        git add estacion.json
        
        if ! git diff-index --quiet HEAD; then
          git commit -m "Meteo: Archivo JSON actualizado automáticamente"
          git push https://x-access-token:${GH_TOKEN}@://github.com{{ github.repository }}.git HEAD
        else
          echo "Los datos no han cambiado. No es necesario actualizar."
        fi
