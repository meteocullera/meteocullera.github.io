name: Actualizar Datos de la Estación

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Asegura el permiso de escritura a nivel de tarea
    steps:
    - name: 1. Descargar archivos del repositorio
      uses: actions/checkout@v4
      with:
        persist-credentials: true # Forzar a Git a recordar las credenciales seguras

    - name: 2. Arrancar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: 3. Instalar conector HTTP
      run: pip install requests

    - name: 4. Ejecutar el procesador meteorológico
      run: python script.py

    - name: 5. Publicar los cambios en GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add dashboard.html
        # Hace el commit solo si el archivo ha cambiado físicamente
        git diff-index --quiet HEAD || git commit -m "Meteo: Dashboard actualizado automáticamente"
        git push origin main
