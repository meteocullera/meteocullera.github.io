yaml
name: Actualizar Clima Automático

on:
  schedule:
    # Se ejecuta automáticamente cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch: # Activa el botón manual

# Permisos necesarios para guardar y actualizar el archivo clima.json en tu web
permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4.2.2

    - name: Configurar Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.x'

    - name: Instalar librerías necesarias
      run: pip install requests

    - name: Ejecutar el script del clima
      env:
        WEATHERLINK_API_KEY: ${{ secrets.WEATHERLINK_API_KEY }}
        WEATHERLINK_API_SECRET: ${{ secrets.WEATHERLINK_API_SECRET }}
        WEATHERLINK_STATION_ID: ${{ secrets.WEATHERLINK_STATION_ID }}
      # Corregido: Ahora apunta al nombre real con puntos
      run: python actualizar.clima.py

    - name: Guardar los cambios en el repositorio
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Actualización automática de datos del clima [skip ci]"
        file_pattern: 'clima.json'
